name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Sync project from lockfile
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m unittest discover tests -v

      - name: Verify production build path with explicit release version
        # MUST stay in sync with publish.yml's three build steps (Compute
        # release version, Sync build backend, Build sdist and wheel).
        # Exercises the file-mutation `uv version` step, the build-info
        # write, the hash-pinned --no-build-isolation build, and that
        # the entry point in the resulting wheel reports the version and
        # build metadata that were set.
        if: matrix.python-version == '3.12'
        run: |
          uv version 1.2.3.4.5
          cat > cloudvm/_build_info.py <<EOF
          COMMIT = "deadbeef0"
          DATE = "2026-01-01"
          EOF
          uv sync --only-group build --locked
          uv build --no-build-isolation
          uv run --isolated --no-project --with dist/*.whl cloudvm --version \
            | grep -F "cloudvm 1.2.3.4.5 (deadbeef0 2026-01-01)"
